
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب صندلی | تراب</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .seat-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin: 24px 0;
            color: #b8b3a7;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-seat {
            width: 16px;
            height: 16px;
            display: inline-block;
            border-radius: 4px;
        }

        .legend-seat.available {
            background: #39362e;
            border: 1px solid #b7a36a;
        }

        .legend-seat.chosen {
            background: #d6b14d;
        }

        .legend-seat.unavailable {
            background: #633d3d;
        }

        .stage {
            max-width: 420px;
            margin: 28px auto;
            padding: 12px;
            text-align: center;
            color: #d6b14d;
            background: #201e19;
            border: 1px solid #625333;
            border-radius: 8px 8px 35px 35px;
        }

        .seat-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
        }

        .row-label {
            width: 22px;
            flex-shrink: 0;
            color: #b7a36a;
            font-size: 13px;
            text-align: center;
        }

        .seats {
            overflow-x: auto;
            padding: 8px 0 20px;
        }

        .seat {
            width: 36px;
            height: 34px;
            flex-shrink: 0;
            border: 1px solid #b7a36a;
            border-radius: 7px 7px 4px 4px;
            background: #39362e;
            color: #f1eee7;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: .15s;
        }

        .seat:hover:not(:disabled) {
            border-color: #d6b14d;
            transform: translateY(-2px);
        }

        .seat.selected {
            background: #d6b14d;
            color: #111;
            border-color: #d6b14d;
        }

        .seat.sold {
            background: #633d3d;
            border-color: #633d3d;
            color: #ddd;
            cursor: not-allowed;
            opacity: .7;
        }

        .seat:focus-visible {
            outline: 2px solid #f1eee7;
            outline-offset: 2px;
        }

        /* فاکتور رزرو */
        .seat-summary.invoice {
            margin: 28px auto;
            padding: 22px;
            border: 1px solid #625333;
            border-radius: 14px;
            background: linear-gradient(145deg, #171713, #0f0f0d);
        }

        .invoice h2 {
            margin: 0 0 16px;
            color: #d6b14d;
            font-size: 20px;
        }

        .invoice-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            padding: 11px 0;
            border-bottom: 1px solid #302d25;
            font-size: 14px;
        }

        .invoice-row span {
            color: #b8b3a7;
        }

        .invoice-row strong {
            text-align: left;
            overflow-wrap: anywhere;
        }

        .invoice-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            padding-top: 15px;
            color: #f1eee7;
        }

        .invoice-total strong {
            color: #d6b14d;
            font-size: 20px;
        }

        .invoice #selectedSeat {
            margin-top: 14px;
            color: #b8b3a7;
            font-size: 12px;
        }

        .seat-error {
            margin-top: 12px;
            color: #e6a1a1;
            font-size: 13px;
        }

        /* دکمه ادامه: طلایی، گرد و شیشه‌ای */
        .continue-button {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 15px 24px;

            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            color: #17150f;
            text-align: center;

            background: linear-gradient(
                135deg,
                rgba(232, 199, 105, 0.96),
                rgba(183, 163, 106, 0.88)
            );

            border: 1px solid rgba(241, 222, 164, 0.65);
            border-radius: 14px;

            box-shadow:
                0 6px 22px rgba(214, 177, 77, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .continue-button:hover {
            background: linear-gradient(
                135deg,
                #f0d785,
                #d6b14d
            );

            box-shadow:
                0 8px 28px rgba(214, 177, 77, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);

            transform: translateY(-2px);
        }

        .continue-button:active {
            transform: translateY(0) scale(0.99);
            box-shadow: 0 3px 12px rgba(214, 177, 77, 0.15);
        }

        .continue-button:focus-visible {
            outline: 2px solid #f1eee7;
            outline-offset: 4px;
        }

        .continue-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #performanceInfo {
            margin-top: 12px;
            color: #b7a36a;
        }

        @media (max-width: 420px) {
            .seat-row {
                gap: 5px;
            }

            .seat {
                width: 30px;
                height: 31px;
                font-size: 11px;
            }

            .seat-summary.invoice {
                padding: 16px 12px;
            }

            .invoice-total strong {
                font-size: 17px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .continue-button,
            .seat {
                transition: none;
            }

            .continue-button:hover,
            .seat:hover:not(:disabled) {
                transform: none;
            }
        }
    </style>
</head>

<body>
<header>
    <a href="index.html" class="logo">تراب <span>گروه هنری نمایشی</span></a>
</header>

<main class="page">
    <h1>انتخاب صندلی</h1>
    <p class="page-intro">صندلی‌های موردنظرت رو انتخاب کن.</p>

    <p id="performanceInfo"></p>

    <div class="stage">صحنه</div>

    <div class="seat-legend">
        <span class="legend-item">
            <span class="legend-seat available"></span>
            آزاد
        </span>
        <span class="legend-item">
            <span class="legend-seat chosen"></span>
            انتخاب‌شده
        </span>
        <span class="legend-item">
            <span class="legend-seat unavailable"></span>
            فروخته‌شده
        </span>
    </div>

    <div id="seats" class="seats" aria-label="نقشه صندلی‌های سالن"></div>

    <section class="seat-summary invoice" aria-labelledby="invoiceTitle">
        <h2 id="invoiceTitle">فاکتور رزرو</h2>

        <div class="invoice-row">
            <span>نوع بلیت</span>
            <strong id="invoiceTicketType">—</strong>
        </div>

        <div class="invoice-row">
            <span>قیمت هر بلیت</span>
            <strong id="invoiceUnitPrice">—</strong>
        </div>

        <div class="invoice-row">
            <span>تعداد صندلی</span>
            <strong id="seatCount">۰</strong>
        </div>

        <div class="invoice-row">
            <span>صندلی‌ها</span>
            <strong id="invoiceSeats">—</strong>
        </div>

        <div class="invoice-total">
            <span>مبلغ قابل پرداخت</span>
            <strong id="invoiceTotal">۰ تومان</strong>
        </div>

        <p id="selectedSeat" aria-live="polite">
            هنوز صندلی انتخاب نشده.
        </p>
    </section>

    <p id="seatError" class="seat-error" role="alert" hidden></p>

    <button id="continueButton" class="btn continue-button" type="button">
        ادامه
    </button>
</main>

<footer>
    <p>© تمامی حقوق مادی و معنوی این وب‌سایت متعلق به گروه هنری تراب است.</p>
</footer>

<script>
    const container = document.getElementById("seats");
    const selectedText = document.getElementById("selectedSeat");
    const seatCount = document.getElementById("seatCount");
    const seatError = document.getElementById("seatError");
    const continueButton = document.getElementById("continueButton");
    const performanceInfo = document.getElementById("performanceInfo");

    const invoiceTicketType = document.getElementById("invoiceTicketType");
    const invoiceUnitPrice = document.getElementById("invoiceUnitPrice");
    const invoiceSeats = document.getElementById("invoiceSeats");
    const invoiceTotal = document.getElementById("invoiceTotal");

    // وضعیت صندلی‌ها فعلاً نمونه است.
    const sold = ["A1", "B4", "D7"];

    let ticketChoice = null;

    try {
        ticketChoice = JSON.parse(
            sessionStorage.getItem("torabTicketChoice") || "null"
        );
    } catch (error) {
        ticketChoice = null;
    }

    const selectedSeats = new Set();

    const ticketNames = {
        full: "عادی",
        half: "نیم‌بها",
        cultural: "نذری"
    };

    // قیمت‌ها در این نسخه نمایشی ثابت هستند.
    const ticketPrices = {
        full: 200000,
        half: 100000,
        cultural: 0
    };

    const ticketType =
        ticketChoice && ticketNames[ticketChoice.type]
            ? ticketChoice.type
            : null;

    const unitPrice = ticketType ? ticketPrices[ticketType] : 0;

    function formatToman(amount) {
        return new Intl.NumberFormat("fa-IR").format(amount) + " تومان";
    }

    if (ticketChoice && ticketType) {
        performanceInfo.textContent =
            "سانس انتخاب‌شده: " +
            ticketChoice.date + "، ساعت " + ticketChoice.time;

        invoiceTicketType.textContent = ticketNames[ticketType];

        invoiceUnitPrice.textContent = unitPrice === 0
            ? "رایگان"
            : formatToman(unitPrice);
    } else {
        performanceInfo.textContent = "هنوز سانسی انتخاب نکرده‌ای.";
        invoiceTicketType.textContent = "انتخاب نشده";
        invoiceUnitPrice.textContent = "—";
    }

    ["A", "B", "C", "D", "E", "F"].forEach(row => {
        const rowElement = document.createElement("div");
        rowElement.className = "seat-row";

        const label = document.createElement("span");
        label.className = "row-label";
        label.textContent = row;
        rowElement.appendChild(label);

        for (let i = 1; i <= 8; i++) {
            const id = row + i;
            const seat = document.createElement("button");

            seat.type = "button";
            seat.textContent = i;
            seat.className = "seat";
            seat.setAttribute("aria-label", "صندلی " + id);
            seat.setAttribute("aria-pressed", "false");

            if (sold.includes(id)) {
                seat.classList.add("sold");
                seat.disabled = true;
                seat.setAttribute(
                    "aria-label",
                    "صندلی " + id + " فروخته‌شده"
                );
            }

            seat.addEventListener("click", () => {
                if (selectedSeats.has(id)) {
                    selectedSeats.delete(id);
                    seat.classList.remove("selected");
                    seat.setAttribute("aria-pressed", "false");
                } else {
                    selectedSeats.add(id);
                    seat.classList.add("selected");
                    seat.setAttribute("aria-pressed", "true");
                }

                updateSummary();
            });

            rowElement.appendChild(seat);
        }

        container.appendChild(rowElement);
    });

    function updateSummary() {
        const seats = [...selectedSeats].sort();
        const count = seats.length;
        const total = count * unitPrice;

        selectedText.textContent = count
            ? "صندلی‌های انتخاب‌شده: " + seats.join("، ")
            : "هنوز صندلی انتخاب نشده.";

        seatCount.textContent =
            new Intl.NumberFormat("fa-IR").format(count);

        invoiceSeats.textContent = count ? seats.join("، ") : "—";

        if (count === 0) {
            invoiceTotal.textContent = "۰ تومان";
        } else if (unitPrice === 0) {
            invoiceTotal.textContent = "رایگان";
        } else {
            invoiceTotal.textContent = formatToman(total);
        }

        seatError.hidden = true;
    }

    updateSummary();

    continueButton.addEventListener("click", () => {
        if (!ticketChoice || !ticketType) {
            seatError.textContent =
                "ابتدا از صفحه رزرو، یک سانس و نوع بلیت انتخاب کن.";
            seatError.hidden = false;
            return;
        }

        if (selectedSeats.size === 0) {
            seatError.textContent =
                "برای ادامه، حداقل یک صندلی انتخاب کن.";
            seatError.hidden = false;
            return;
        }

        const reservationData = {
            date: ticketChoice.date,
            time: ticketChoice.time,
            type: ticketType,
            price: unitPrice,
            seats: [...selectedSeats].sort(),
            total: selectedSeats.size * unitPrice
        };

        sessionStorage.setItem(
            "torabReservation",
            JSON.stringify(reservationData)
        );

        window.location.href = "buyer.html";
    });
</script>
</body>
</html>
